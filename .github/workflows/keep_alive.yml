name: Keep Alive Streamlit

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır
    - cron: '0 */6 * * *'
  # Actions sekmesine "Run workflow" butonunu ekler
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update keep_alive.txt
        run: |
          echo "Keep-alive update: $(date -u)" > keep_alive.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add keep_alive.txt
          git commit -m "Keep-alive update: $(date -u)" || exit 0
          git push
